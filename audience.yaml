# =============================================================================
# 타깃 독자 · 중요도 기준 · 제외 조건
# 이 파일 하나만 고치면 뉴스레터의 성격이 바뀐다. 코드에는 기준을 하드코딩하지 않는다.
# =============================================================================

newsletter:
  name: "오늘의 기후 브리핑"
  subtitle: "환경·기후 뉴스에서 실무 판단에 쓰이는 것만"
  timezone: "Asia/Seoul"
  language: "ko"

audience:
  persona: |
    국내 중견·대기업의 지속가능경영(ESG)·환경안전 담당 3~7년차 실무자,
    그리고 기후테크 스타트업의 기획·사업개발 담당자.
  knows_already: |
    기후변화가 실재한다는 사실, 탄소중립·RE100·CBAM 같은 용어의 기본 뜻,
    작년까지의 주요 국제 합의 흐름. 개론 설명은 필요 없다.
  needs: |
    (1) 내일 회의에서 인용할 수 있는 새로운 사실과 숫자
    (2) 규제·공시·정책이 언제부터 무엇을 요구하는지
    (3) 기술·시장이 실제로 어느 단계까지 왔는지 (파일럿인가 상용인가)
    (4) 위 내용이 한국 기업 실무에 무슨 의미인지
  reading_context: "출근길 5분, 모바일 이메일"

# -----------------------------------------------------------------------------
# 중요도 판단 문장 (LLM 선별 프롬프트에 그대로 주입된다)
# -----------------------------------------------------------------------------
importance_statement: |
  이 기사가 "국내 ESG 실무자가 내일 업무 판단을 바꾸는 데 도움이 되는가"를 기준으로 판단하라.
  기후 이슈 자체의 도덕적 중요성이 아니라, 독자의 의사결정에 들어가는 정보량으로 평가한다.
  같은 사건이라도 '발표가 있었다'는 속보보다 '무엇이 언제부터 어떻게 바뀐다'는 기사가 높다.

scoring:
  # 예선(prescreen): 제목 + 피드 요약만 보고 0~10점
  prescreen:
    model_tier: "cheap"
    batch_size: 8          # 한 번의 LLM 호출에 넣는 기사 수
    keep_top: 12           # 본선에 올릴 기사 수
    min_score: 4           # 이 점수 미만은 본선 진출 불가
    max_per_source: 3      # 한 소스가 본선 진출자를 독식하지 못하게 하는 상한
  # 본선(finalscreen): 본문 전체를 보고 차원별 점수
  finalscreen:
    model_tier: "smart"
    batch_size: 4
    dimensions:            # 가중치 합 = 1.0
      impact:            { weight: 0.25, desc: "영향 받는 범위와 규모가 큰가 (국가·산업 단위인가)" }
      actionability:     { weight: 0.30, desc: "독자가 업무에서 참고·인용·대응할 수 있는 구체성이 있는가" }
      novelty:           { weight: 0.20, desc: "오늘 처음 알려진 사실인가, 아니면 이미 알려진 내용의 반복인가" }
      evidence:          { weight: 0.15, desc: "수치·1차 자료·공식 발표 등 근거가 기사 안에 있는가" }
      korea_relevance:   { weight: 0.10, desc: "한국 기업·정책·시장과 직접 연결되는가" }
    select_min: 3          # 최소 선정 건수
    select_max: 5          # 최대 선정 건수
    min_weighted: 5.0      # 가중 총점(0~10) 하한. 미달이면 3건이 안 되어도 싣지 않는다
    max_per_source: 2      # 한 소스에서 최대 2건. 한 매체의 논조로 레터가 채워지는 것을 막는다
    min_distinct_sources: 2  # 최소 소스 수. 못 채우면 상한을 풀어서라도 건수를 맞춘다

# -----------------------------------------------------------------------------
# 제외 조건 (규칙 기반 1차 필터 + LLM 선별 프롬프트에 동시 적용)
# -----------------------------------------------------------------------------
exclude:
  max_age_hours: 48        # 일간 뉴스레터. 48시간 넘은 기사는 버린다
  min_title_chars: 10
  title_blocklist:         # 제목에 이 단어가 있으면 즉시 탈락 (대소문자 무시)
    - "부고"
    - "인사"
    - "포토"
    - "사진"
    - "카드뉴스"
    - "오늘의 운세"
    - "주간 브리핑"
    - "newsletter"
    - "weekly roundup"
    - "podcast"
    - "webinar"
    - "job board"
    - "we're hiring"
  editorial_rules: |
    - 개인 실천 팁("텀블러를 쓰자") 위주의 라이프스타일 기사는 제외한다.
    - 특정 기업의 제품 홍보·수주 보도자료를 그대로 옮긴 기사는 제외한다.
    - 행사·시상식·MOU 체결 소식은 그 자체로는 제외한다(구체적 이행 조건이 있으면 예외).
    - 정치인 발언 공방, 진영 논쟁 중심 기사는 제외한다.
    - 감정 호소 위주이고 검증 가능한 사실이 적은 기사는 제외한다.

# -----------------------------------------------------------------------------
# 요약 · 인사이트 생성 규칙
# -----------------------------------------------------------------------------
summarize:
  model_tier: "smart"
  style: |
    - 한국어 존댓말, 문장은 짧게.
    - 숫자·날짜·기관명은 원문에 있는 것만 쓴다. 반올림·환산·추정 금지.
    - 원문에 없는 배경지식을 사실처럼 덧붙이지 않는다.
  fields:
    headline: "20자 내외 한국어 제목"
    what_happened: "무슨 일이 있었는지 2~3문장"
    why_it_matters: "타깃 독자에게 왜 중요한지 2문장 (원문 사실에 근거한 해석)"
    reader_takeaway: "독자가 당장 할 수 있는 행동·확인 사항 1문장"
    claims: "요약에 사용한 검증 대상 사실 3~5개. 각각 원문 인용문과 함께"

# -----------------------------------------------------------------------------
# 자동 검수 (할루시네이션·오류 판별) 기준
# -----------------------------------------------------------------------------
verify:
  model_tier: "smart"
  max_retries: 2                 # 재생성 시도 횟수
  rules:
    number_must_appear: true     # 요약에 등장한 숫자는 원문에도 있어야 함
    date_must_appear: true
    max_unsupported_claims: 0    # 근거 없는 주장 0건이어야 통과
    min_claim_support_rate: 1.0
  on_fail: "regenerate_then_skip" # 재생성 -> 그래도 실패하면 해당 기사 스킵 + 대기 후보로 교체

# -----------------------------------------------------------------------------
# 발행
# -----------------------------------------------------------------------------
publish:
  channel: "email"           # email | dry_run
  subject_format: "[오늘의 기후 브리핑] {date} · {top_headline}"
  save_local: true           # 항상 out/ 에 html/md 사본을 남긴다
  fail_open: true            # 메일 전송 실패해도 파이프라인은 성공 처리하고 로컬 사본 유지
