# =============================================================================
# 채택 소스 — "AI의 청구서" (AI가 사회와 환경에 떠넘기는 비용)
# 실측: tools/source_probe.py --candidates tools/source_candidates_ai.yaml --out ai
# 근거: docs/source_audit_ai.md / store/source_audit_ai.json  (후보 35개)
#
# 채택 기준
#   C1  도달성   : HTTP 200 + 파싱 성공 + 엔트리 >= 1
#   C2' 공급량   : 주력 = 주제 기사 7일 >= 3건 / 전문 = 7일 >= 1건 + 적중률 >= 0.10
#                  (소스당 수집 비용이 HTTP 1회뿐이라, 주 1건이어도 정밀도가 높으면 넣는다)
#   C3  적중률   : >= 0.10  (넓은 피드의 부분집합이라 환경 주제의 0.60은 불가능)
#   C4  본문확보 : 추출 성공률 >= 0.60 AND 길이 중앙값 >= 800자   [양보 불가 — 검수가 원문 대조]
#   C5  다양성   : 다른 채택 소스와 제목 중복률 <= 0.30
#   C6  접근성   : 페이월 검출률 = 0                              [양보 불가]
#   C7  정밀도   : 매칭 헤드라인 표본의 절반 이상이 실제 주제      [신설 — 자동 지표만으로는 못 거른다]
#
# 집계 검증: 채택 12개 합계 주제 기사 48시간 52건 (요구 >= 15건)
# =============================================================================

fetch:
  user_agent: "Mozilla/5.0 (compatible; ai-cost-newsletter-bot/1.0; personal project)"
  timeout_sec: 25
  max_items_per_source: 15    # C3 완화(0.15->0.10)에 맞춰 25->15. 노이즈 비용을 건수로 직접 통제
  concurrency: 8
  polite_delay_sec: 0.3

sources:
  # ---------- 주력: 매일 공급을 책임진다 (주제 기사 7일 >= 3건) ----------
  - id: guardian_ai
    name: The Guardian AI
    url: https://www.theguardian.com/technology/artificialintelligenceai/rss
    lang: en
    bucket: 정책·권리
    weight: 1.10              # 주제7일 10건, 표본 정밀 3/4. 두 축이 교차하는 기사가 나온다
  - id: wired_ai
    name: WIRED AI
    url: https://www.wired.com/feed/tag/ai/latest/rss
    lang: en
    bucket: AI 피해·탐사
    weight: 1.10              # 적중률 0.60, 표본 정밀 4/4
  - id: digitaltoday
    name: 디지털투데이
    url: https://www.digitaltoday.co.kr/rss/allArticle.xml
    lang: ko
    bucket: 국내 테크
    weight: 1.10              # 국내 표본 정밀도 최상 3/4
  - id: electimes
    name: 전기신문
    url: https://www.electimes.com/rss/allArticle.xml
    lang: ko
    bucket: 데이터센터·전력
    weight: 1.05              # 국내에서 AI×전력을 다루는 사실상 유일한 소스
  - id: zdnet_kr
    name: 지디넷코리아
    url: https://feeds.feedburner.com/zdkorea
    lang: ko
    bucket: 국내 테크
    weight: 0.95              # 주제7일 12건으로 국내 최대지만 표본 정밀 2/4 -> 가중 하향
  - id: etnews
    name: 전자신문
    url: https://rss.etnews.com/Section901.xml
    lang: ko
    bucket: 국내 산업·노동
    weight: 0.95              # 정밀 2/4. 감원·정책 기사에서 값이 나온다

  # ---------- 전문: 주 1~2건이지만 표본 정밀도가 높다 ----------
  - id: arstechnica_ai
    name: Ars Technica AI
    url: https://arstechnica.com/ai/feed/
    lang: en
    bucket: AI 피해·탐사
    weight: 1.10              # 표본 정밀 3/3, 본문 11,129자
  - id: media404
    name: 404 Media
    url: https://www.404media.co/rss/
    lang: en
    bucket: AI 피해·탐사
    weight: 1.10              # 표본 정밀 2/2. 데이터센터 지역 저항 등 다른 소스가 안 쓰는 각도
  - id: restofworld
    name: Rest of World
    url: https://restofworld.org/feed/latest/
    lang: en
    bucket: 글로벌 노동·불평등
    weight: 1.10              # 표본 정밀 4/4. 비서구권 노동자 관점은 여기서만 나온다
  - id: latitude
    name: Latitude Media
    url: https://www.latitudemedia.com/feed
    lang: en
    bucket: 데이터센터·전력
    weight: 1.15              # 주제 정중앙. 환경 축이 희소해 가중 상향
  - id: utilitydive
    name: Utility Dive
    url: https://www.utilitydive.com/feeds/news/
    lang: en
    bucket: 데이터센터·전력
    weight: 1.05              # 규제기관 심의 시점 (PUC 요금·계통 접속)
  - id: eff
    name: EFF Deeplinks
    url: https://www.eff.org/rss/updates.xml
    lang: en
    bucket: 정책·권리
    weight: 1.00              # 권리단체 시점. 몰아서 발행하는 편이라 48h 0건인 날이 있다

